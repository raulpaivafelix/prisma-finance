<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prisma Finance | BPO Financeiro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabeçalho com Logótipo e Botão -->
    <header>
        <div class="logo">
            <!-- Brasão do topo corrigido -->
            <img src="assets/prisma-brasao.svg" class="brand-crest" alt="Brasão da Prisma Finance">
            <span>Prisma Finance</span>
        </div>
        
        <!-- Botão Interativo -->
        <div class="menu-interativo">
            <button onclick="alternarOpcoes()" class="botao-opcoes">Ver Opções</button>
            
            <div id="caixa-opcoes" class="opcoes-ocultas">
                <a href="#inicio">Início</a>
                <a href="#meio">Meio</a>
                <a href="#fim">Fim</a>
            </div>
        </div>
    </header>

    <!-- Conteúdo do Site (Mantenha os textos que já tinha escrito aqui no meio) -->
    <main>
        <section id="inicio">
            <h1>Terceirize o financeiro da sua empresa e compre o seu tempo de volta.</h1>
            <p>A Prisma Finance organiza o seu fluxo de caixa...</p>
        </section>
        
        <section id="meio">
            <h2>O seu negócio vende todo dia, mas o seu caixa está cego?</h2>
        </section>
    </main>

    <!-- Rodapé -->
    <footer id="fim">
        <!-- Brasão de baixo corrigido -->
        <img src="assets/prisma-brasao.svg" class="brand-crest" alt="Brasão da Prisma Finance">
        <p>Prisma Finance &copy; 2026. Todos os direitos reservados.</p>
    </footer>

    <!-- Conexão com o ficheiro JavaScript (Sempre no fim!) -->
    <script src="js/script.js"></script>
</body>
</html>
